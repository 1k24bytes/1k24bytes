name: Update profile README cards

on:
  workflow_dispatch:
  schedule:
    # 08:00 India Standard Time (02:30 UTC), every day.
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: profile-readme-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch public contribution calendar
        run: python scripts/fetch_contributions.py --username 1k24bytes

      - name: Render animated SVG cards
        run: python scripts/render_readme_cards.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/*.svg
          if git diff --cached --quiet; then
            echo "No profile card changes to commit."
          else
            git commit -m "chore: refresh profile README cards"
            git push
          fi
