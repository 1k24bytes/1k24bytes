<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profile README — Preview</title>
<style>
  :root {
    --page: #0b0e13;
    --raised: #161b25;
    --ink: #f2f4f8;
    --muted: #9aa3b2;
    --rule: #262d3a;
    --accent: #8aa6ff;
    --accent-deep: #b9c8ff;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--page);
    border-bottom: 1px solid var(--rule);
  }
  .topbar-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
  }
  .topbar code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--ink);
    background: var(--raised);
    border: 1px solid var(--rule);
    padding: 4px 8px;
    border-radius: 6px;
  }
  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .stack > a { display: block; }
  .row { display: flex; gap: 16px; }
  .row > a { display: block; flex: 1 1 0; min-width: 0; }
  a.card-link { text-decoration: none; }
  a.card-link img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 18px;
  }
  footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    font-size: 14px;
  }
  footer a {
    color: var(--accent);
    transition: color 150ms var(--ease);
  }
  footer a:hover { color: var(--accent-deep); }
  .hint {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 13px;
  }
  .hint code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
  }
  @media (max-width: 720px) {
    .row { flex-direction: column; }
    .wrap { padding: 16px 16px 48px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <span>Preview of <code>README.md</code></span>
      <span>cards/ · live SVGs</span>
    </div>
  </div>

  <main class="wrap">
    <p class="hint">Edit <code>scripts/render_readme_cards.py</code>, re-run the renderer, then refresh. If cards show blank in your viewer, run <code>python scripts/build_preview.py</code> and open <code>preview-standalone.html</code>.</p>

    <div class="stack">
      <a class="card-link" href="https://tawqeer.is-a.dev"><img src="./cards/hero.svg" alt="Tawqeer Amin Dar — Full Stack Developer" /></a>

      <a class="card-link" href="https://github.com/1k24bytes"><img src="./cards/contributions.svg" alt="GitHub contribution calendar" /></a>

      <a class="card-link" href="https://github.com/1k24bytes"><img src="./cards/activity.svg" alt="Monthly GitHub activity and contribution statistics" /></a>

      <div class="row">
        <a class="card-link" href="https://github.com/1k24bytes?tab=repositories"><img src="./cards/build.svg" alt="Build — products and systems" /></a>
        <a class="card-link" href="https://tawqeer.is-a.dev"><img src="./cards/brand.svg" alt="Brand — interfaces and design" /></a>
        <a class="card-link" href="https://github.com/1k24bytes?tab=stars"><img src="./cards/learn.svg" alt="Learn — experiments and notes" /></a>
      </div>
    </div>

    <footer>
      <a href="https://tawqeer.is-a.dev">Portfolio</a>
      <a href="https://github.com/1k24bytes">GitHub</a>
      <a href="mailto:tawqeerdar21@gmail.com">Email</a>
    </footer>
  </main>
</body>
</html>
