<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Monthly GitHub activity and statistics"><title>Monthly GitHub activity and statistics</title><style>
      
      text { fill: #161616; }
      .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
      .sans { font-family: 'Geist', Arial, sans-serif; }
      .mono { font-family: 'Geist', 'Courier New', monospace; }
      .muted { fill: #6f6f6f; }
      .rule { stroke: #e6e6e6; stroke-width: 1; }
      
    @keyframes rise { 0% { opacity:0; transform:translateY(18px); } 100% { opacity:1; transform:translateY(0); } }
    @keyframes print { 0% { opacity:0; } 100% { opacity:1; } }
    @keyframes grow { 0% { transform:scaleY(.02); opacity:.5; } 100% { transform:scaleY(1); opacity:1; } }
    @keyframes tile-in { 0% { opacity:0; transform:translateY(25px) rotate(1.8deg); } 70% { opacity:1; transform:translateY(-3px) rotate(-.3deg); } 100% { opacity:1; transform:translateY(0) rotate(0); } }
    @keyframes pulse { 0%,100% { opacity:.18; } 50% { opacity:.7; } }
    @keyframes nudge { 0%,100% { transform:translateX(0); } 50% { transform:translateX(7px); } }
    .anim { animation:rise .75s cubic-bezier(.2,.75,.25,1) both; }
    .print-row { opacity:0; animation:print .2s linear forwards; }
    .bar { transform-box:fill-box; transform-origin:bottom; animation:grow .85s cubic-bezier(.2,.7,.2,1) both; }
    .tile-enter { animation:tile-in .8s cubic-bezier(.2,.8,.2,1) both; }
    .pulse { animation:pulse 2.6s ease-in-out infinite; }
    .arrow { animation:nudge 2.2s ease-in-out infinite; }
    
      
    @media (prefers-reduced-motion: reduce) {
      .anim, .print-row, .bar, .tile-enter, .smil-motion, .arrow, .pulse { animation: none !important; }
      .anim, .print-row, .bar, .tile-enter { opacity: 1 !important; transform: none !important; }
      .smil-motion { display: none !important; }
    }
    
    </style><rect width="1200" height="380" rx="18" fill="#ffffff"/><rect x="1" y="1" width="1198" height="378" rx="17" fill="none" stroke="#e6e6e6"/><text x="40" y="54" class="sans muted" font-size="12" letter-spacing="2">THE LAST 12 MONTHS ON GITHUB</text><text x="38" y="114" class="serif" font-size="46">2,735 <tspan font-style="italic">contributions</tspan></text><rect x="53.5" y="280.0" width="26.9" height="0.0" rx="2" fill="#161616" class="bar" style="animation-delay:0.00s"><title>Nov: 0 contributions</title></rect><text x="66.9" y="304" class="sans muted" font-size="12" text-anchor="middle">Nov</text><rect x="107.3" y="280.0" width="26.9" height="0.0" rx="2" fill="#161616" class="bar" style="animation-delay:0.06s"><title>Dec: 0 contributions</title></rect><text x="120.8" y="304" class="sans muted" font-size="12" text-anchor="middle">Dec</text><rect x="161.2" y="252.9" width="26.9" height="27.1" rx="2" fill="#161616" class="bar" style="animation-delay:0.12s"><title>Jan: 184 contributions</title></rect><text x="174.6" y="304" class="sans muted" font-size="12" text-anchor="middle">Jan</text><rect x="215.0" y="248.4" width="26.9" height="31.6" rx="2" fill="#161616" class="bar" style="animation-delay:0.18s"><title>Feb: 214 contributions</title></rect><text x="228.5" y="304" class="sans muted" font-size="12" text-anchor="middle">Feb</text><rect x="268.8" y="267.9" width="26.9" height="12.1" rx="2" fill="#161616" class="bar" style="animation-delay:0.24s"><title>Mar: 82 contributions</title></rect><text x="282.3" y="304" class="sans muted" font-size="12" text-anchor="middle">Mar</text><rect x="322.7" y="273.5" width="26.9" height="6.5" rx="2" fill="#161616" class="bar" style="animation-delay:0.30s"><title>Apr: 44 contributions</title></rect><text x="336.2" y="304" class="sans muted" font-size="12" text-anchor="middle">Apr</text><rect x="376.5" y="262.3" width="26.9" height="17.7" rx="2" fill="#161616" class="bar" style="animation-delay:0.36s"><title>May: 120 contributions</title></rect><text x="390.0" y="304" class="sans muted" font-size="12" text-anchor="middle">May</text><rect x="430.4" y="236.5" width="26.9" height="43.5" rx="2" fill="#161616" class="bar" style="animation-delay:0.42s"><title>Jun: 295 contributions</title></rect><text x="443.8" y="304" class="sans muted" font-size="12" text-anchor="middle">Jun</text><rect x="484.2" y="240.2" width="26.9" height="39.8" rx="2" fill="#161616" class="bar" style="animation-delay:0.48s"><title>Jul: 270 contributions</title></rect><text x="497.7" y="304" class="sans muted" font-size="12" text-anchor="middle">Jul</text><rect x="538.1" y="170.0" width="26.9" height="110.0" rx="2" fill="#2447f5" class="bar" style="animation-delay:0.54s"><title>Aug: 746 contributions</title></rect><text x="551.5" y="162.0" class="sans" font-size="13" text-anchor="middle" fill="#2447f5">746</text><text x="551.5" y="304" class="sans muted" font-size="12" text-anchor="middle">Aug</text><rect x="591.9" y="201.1" width="26.9" height="78.9" rx="2" fill="#161616" class="bar" style="animation-delay:0.60s"><title>Sep: 535 contributions</title></rect><text x="605.4" y="304" class="sans muted" font-size="12" text-anchor="middle">Sep</text><rect x="645.8" y="255.4" width="26.9" height="24.6" rx="2" fill="#161616" class="bar" style="animation-delay:0.66s"><title>Oct: 167 contributions</title></rect><text x="659.2" y="304" class="sans muted" font-size="12" text-anchor="middle">Oct</text><rect x="699.6" y="268.5" width="26.9" height="11.5" rx="2" fill="#161616" class="bar" style="animation-delay:0.72s"><title>Nov: 78 contributions</title></rect><text x="713.1" y="304" class="sans muted" font-size="12" text-anchor="middle">Nov</text><line x1="800" y1="60" x2="800" y2="320" class="rule"/><text x="840" y="150" class="serif" font-size="40">1 days</text><text x="840" y="174" class="sans muted" font-size="13">current streak</text><line x1="840" y1="198" x2="1160" y2="198" class="rule"/><text x="840" y="240" class="serif" font-size="40">235</text><text x="840" y="264" class="sans muted" font-size="13">days with a commit</text><line x1="840" y1="288" x2="1160" y2="288" class="rule"/><text x="840" y="330" class="serif" font-size="40">85</text><text x="840" y="354" class="sans muted" font-size="13">on the busiest day</text></svg>
